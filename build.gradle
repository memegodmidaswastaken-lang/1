plugins {
    id 'java'
}

group = 'dev.dominioncore'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
}

def testRuntimeClasspath = sourceSets.test.runtimeClasspath

tasks.register('runTestSuite', JavaExec) {
    group = 'verification'
    description = 'Runs the plain-Java DominionCore test suite.'
    dependsOn(tasks.testClasses)
    classpath = testRuntimeClasspath
    mainClass = 'dev.dominioncore.TestSuite'
}

tasks.register('runPrototypeServer', JavaExec) {
    group = 'application'
    description = 'Runs the socket-based prototype server for local client/server testing.'
    dependsOn(tasks.classes)
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.dominioncore.server.PrototypeServerMain'
    args(
            (findProperty('port') ?: '5050').toString(),
            (findProperty('saveRoot') ?: 'runtime/socket-server').toString()
    )
}

tasks.register('runPrototypeClient', JavaExec) {
    group = 'application'
    description = 'Runs the socket-based prototype client for local client/server testing.'
    dependsOn(tasks.classes)
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.dominioncore.client.PrototypeClientMain'

    if (project.hasProperty('clientArgs')) {
        args(project.property('clientArgs').toString().split('\\s+').findAll { !it.isBlank() })
    } else {
        args('127.0.0.1', '5050', 'player-one')
    }
}

tasks.named('test') {
    // Keep `gradle test` as the main entrypoint while delegating execution to our plain Java suite.
    dependsOn(tasks.named('runTestSuite'))
}

tasks.named('check') {
    dependsOn(tasks.named('runTestSuite'))
}
